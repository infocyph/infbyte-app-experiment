name: Runwire candidate production qualification

# Isolated pre-release lane. The published main matrix and its trigger are unchanged.
on:
  push:
    branches: [qa/runwire-production-feedback]
    paths: ['qa/runwire-candidate-request.json']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: runwire-candidate-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      reference: ${{ steps.matrix.outputs.reference }}
      first: ${{ steps.matrix.outputs.first }}
      second: ${{ steps.matrix.outputs.second }}
      jwks: ${{ steps.matrix.outputs.jwks }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve candidate identity and derive frozen runtime tuples
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          reference="$(git ls-remote --exit-code https://github.com/infocyph/Runwire refs/heads/qa/production-feedback-candidate-4 | cut -f1)"
          [[ "$reference" =~ ^[0-9a-f]{40}$ ]]
          expected="$(jq -er '.candidate_reference' qa/runwire-candidate-request.json)"
          [[ "$expected" =~ ^[0-9a-f]{40}$ && "$expected" == "$reference" ]]
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          printf 'Qualifying unreleased Runwire source %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          groups = {"runtime": [], "runtime-2": [], "authentication": []}
          jwks_scenarios = {
              "ecosystem-remote-jwks", "ecosystem-jwks-dns-public", "ecosystem-jwks-dns-private",
              "ecosystem-jwks-dns-mixed", "ecosystem-jwks-dns-empty", "ecosystem-jwks-dns-rebind",
          }
          group = None
          for line in Path(".github/workflows/production-workloads.yml").read_text(encoding="utf-8").splitlines():
              job = re.fullmatch(r"  ([a-z0-9-]+):", line)
              if job:
                  group = job.group(1)
              if group not in groups:
                  continue
              match = re.fullmatch(r"\s*- \{(scenario: [^}]+)\}\s*", line)
              if not match:
                  continue
              row = dict(part.strip().split(": ", 1) for part in match.group(1).split(","))
              if group == "authentication" and row["scenario"] not in jwks_scenarios:
                  continue
              if row.get("php", "8.5").strip("'") != "8.5":
                  raise SystemExit("Unexpected runtime PHP series")
              groups[group].append({
                  "scenario": row["scenario"],
                  "backend": row["backend"],
                  "host": row.get("host", "worker"),
                  "matcher": row.get("matcher", "fused"),
              })
          first, second, jwks = groups["runtime"], groups["runtime-2"], groups["authentication"]
          if (len(first), len(second)) != (256, 51) or len({tuple(row.values()) for row in first + second}) != 307:
              raise SystemExit("Frozen runtime matrix changed; review the candidate scope")
          if len(jwks) != 6 or {row["scenario"] for row in jwks} != jwks_scenarios:
              raise SystemExit("Frozen JWKS matrix changed; review the candidate scope")
          request = json.loads(Path("qa/runwire-candidate-request.json").read_text(encoding="utf-8"))
          retired = set(request["scope"]["retired"])
          retired_rows = [row for row in first + second if row["scenario"] in retired]
          if len(retired_rows) != 7 or {row["scenario"] for row in retired_rows} != retired:
              raise SystemExit("Retired protocol inventory changed")
          first = [row for row in first if row["scenario"] not in retired]
          second = [row for row in second if row["scenario"] not in retired]
          if (len(first), len(second)) != (249, 51) or len(first + second) != request["scope"]["runtime"]:
              raise SystemExit("Retained runtime inventory changed")
          print("Explicitly retired native HTTP/3-only tuples:", json.dumps(retired_rows, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, rows in (("first", first), ("second", second), ("jwks", jwks)):
                  output.write(name + "=" + json.dumps({"include": rows}, separators=(",", ":")) + "\n")
          PY

  dependency-preflight:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      SCENARIO: ecosystem-http-pool
      HOST_MODE: worker
      LAB_MATCHER: fused
      DB_BACKEND: pgsql
      PHP_SERIES: '8.5'
      LAB_RUNWIRE_CANDIDATE_REFERENCE: ${{ needs.prepare.outputs.reference }}
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-production-workload
        with:
          worker_type: runtime
          scenario: ecosystem-http-pool
          backend: pgsql
          host: worker
          extensions: pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, redis, curl, mbstring, intl, sodium, zip, fileinfo, apcu, shmop, sysvsem
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runwire-4-dependency-preflight
          path: ${{ runner.temp }}/workload-evidence/
          retention-days: 30

  runtime:
    needs: [prepare, dependency-preflight]
    name: "${{ matrix.scenario }} / ${{ matrix.backend }} / ${{ matrix.host }} / ${{ matrix.matcher }} / PHP 8.5"
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.first) }}
    uses: ./.github/workflows/production-worker-runtime.yml
    with:
      scenario: ${{ matrix.scenario }}
      backend: ${{ matrix.backend }}
      host: ${{ matrix.host }}
      matcher: ${{ matrix.matcher }}
      runwire_candidate_reference: ${{ needs.prepare.outputs.reference }}

  runtime-2:
    needs: [prepare, dependency-preflight]
    name: "${{ matrix.scenario }} / ${{ matrix.backend }} / ${{ matrix.host }} / ${{ matrix.matcher }} / PHP 8.5"
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.second) }}
    uses: ./.github/workflows/production-worker-runtime.yml
    with:
      scenario: ${{ matrix.scenario }}
      backend: ${{ matrix.backend }}
      host: ${{ matrix.host }}
      matcher: ${{ matrix.matcher }}
      runwire_candidate_reference: ${{ needs.prepare.outputs.reference }}

  jwks:
    needs: [prepare, dependency-preflight]
    name: "${{ matrix.scenario }} / ${{ matrix.backend }} / ${{ matrix.host }} / ${{ matrix.matcher }} / PHP 8.5"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.jwks) }}
    uses: ./.github/workflows/production-worker-authentication.yml
    with:
      scenario: ${{ matrix.scenario }}
      backend: ${{ matrix.backend }}
      host: ${{ matrix.host }}
      matcher: ${{ matrix.matcher }}
      runwire_candidate_reference: ${{ needs.prepare.outputs.reference }}
