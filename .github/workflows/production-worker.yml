name: Production workload worker
on:
  workflow_call:
    inputs:
      scenario:
        required: true
        type: string
      backend:
        required: true
        type: string
      host:
        type: string
        default: worker
      matcher:
        type: string
        default: fused
      php:
        type: string
        default: '8.6'
permissions:
  contents: read
jobs:
  execute:
    name: Execute workload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: experiment
          POSTGRES_USER: experiment
          POSTGRES_PASSWORD: experiment
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U experiment -d experiment" --health-interval 5s --health-timeout 5s --health-retries 15
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: experiment
          MYSQL_USER: experiment
          MYSQL_PASSWORD: experiment
          MYSQL_ROOT_PASSWORD: experiment-root
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h localhost --silent" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: ${{ inputs.backend == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_DATABASE: experiment
          MARIADB_USER: experiment
          MARIADB_PASSWORD: experiment
          MARIADB_ROOT_PASSWORD: experiment-root
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: ${{ inputs.backend == 'mssql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_ENABLE_HADR: ${{ inputs.scenario == 'db-sqlserver-ag' && '1' || '0' }}
          MSSQL_SA_PASSWORD: 'Experiment-Only-42!'
        ports: ['1433:1433']
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
      valkey:
        image: ${{ (inputs.scenario == 'cache-valkey' || inputs.scenario == 'ecosystem-counter-contracts' || inputs.scenario == 'ecosystem-valkey-counter-uncertain' || inputs.scenario == 'ecosystem-otp-valkey' || inputs.scenario == 'ecosystem-cache-atomic-valkey' || inputs.scenario == 'ecosystem-cache-bulk-valkey' || inputs.scenario == 'ecosystem-cache-tags-valkey' || inputs.scenario == 'ecosystem-cache-remember-valkey' || inputs.scenario == 'ecosystem-cache-lock-ownership-valkey' || inputs.scenario == 'ecosystem-cache-stampede-valkey' || inputs.scenario == 'ecosystem-cache-metrics-valkey' || inputs.scenario == 'ecosystem-foundation-risk-qualification-valkey' || inputs.scenario == 'ecosystem-foundation-webhook-replay-valkey' || inputs.scenario == 'ecosystem-foundation-webhook-rotation-valkey' || inputs.scenario == 'ecosystem-foundation-risk-corruption-valkey' || inputs.scenario == 'ecosystem-di-cache-parity-valkey' || inputs.scenario == 'ecosystem-di-cache-process-valkey' || inputs.scenario == 'ecosystem-otp-challenge-replacement-valkey' || inputs.scenario == 'ecosystem-otp-rotation-orchestration-valkey' || inputs.scenario == 'ecosystem-otp-mobile-rotation-immediate-valkey' || inputs.scenario == 'ecosystem-otp-mobile-rotation-overlap-valkey' || inputs.scenario == 'ecosystem-otp-rotation-hotp-valkey' || inputs.scenario == 'ecosystem-otp-rotation-ocra-counter-valkey' || inputs.scenario == 'ecosystem-otp-rotation-ocra-challenge-valkey' || inputs.scenario == 'ecosystem-response-cache-freshness-valkey' || inputs.scenario == 'ecosystem-response-cache-bypass-valkey' || inputs.scenario == 'ecosystem-foundation-risk-isolation-valkey' || inputs.scenario == 'ecosystem-foundation-risk-concurrent-valkey' || inputs.scenario == 'ecosystem-cache-ttl-forms-valkey' || inputs.scenario == 'ecosystem-cache-mixed-atomic-valkey' || inputs.scenario == 'ecosystem-cache-payload-policy-valkey') && 'valkey/valkey:8' || '' }}
        ports: ['6380:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
      memcached:
        image: ${{ (inputs.scenario == 'cache-memcached' || startsWith(inputs.scenario, 'ecosystem-cache-memcached-') || inputs.scenario == 'ecosystem-cache-atomic-memcached' || inputs.scenario == 'ecosystem-cache-bulk-memcached' || inputs.scenario == 'ecosystem-cache-tags-memcached' || inputs.scenario == 'ecosystem-cache-remember-memcached' || inputs.scenario == 'ecosystem-cache-lock-ownership-memcached' || inputs.scenario == 'ecosystem-cache-stampede-memcached' || inputs.scenario == 'ecosystem-cache-metrics-memcached' || inputs.scenario == 'ecosystem-foundation-risk-qualification-memcached' || inputs.scenario == 'ecosystem-foundation-webhook-replay-memcached' || inputs.scenario == 'ecosystem-foundation-webhook-rotation-memcached' || inputs.scenario == 'ecosystem-foundation-risk-corruption-memcached' || inputs.scenario == 'ecosystem-foundation-risk-outage-memcached' || inputs.scenario == 'ecosystem-di-cache-parity-memcached' || inputs.scenario == 'ecosystem-di-cache-process-memcached' || inputs.scenario == 'ecosystem-response-cache-freshness-memcached' || inputs.scenario == 'ecosystem-response-cache-bypass-memcached' || inputs.scenario == 'ecosystem-foundation-risk-isolation-memcached' || inputs.scenario == 'ecosystem-foundation-risk-concurrent-memcached' || inputs.scenario == 'ecosystem-cache-ttl-forms-memcached' || inputs.scenario == 'ecosystem-cache-mixed-atomic-memcached' || inputs.scenario == 'ecosystem-cache-payload-policy-memcached') && 'memcached:1.6' || '' }}
        ports: ['11211:11211']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      SCENARIO: ${{ inputs.scenario }}
      HOST_MODE: ${{ inputs.host || 'worker' }}
      LAB_MATCHER: ${{ inputs.matcher || 'fused' }}
      DB_BACKEND: ${{ inputs.backend }}
      PHP_SERIES: ${{ inputs.php || '8.6' }}
      SOAK: ${{ inputs.scenario == 'http' && inputs.host == 'native' && inputs.backend == 'pgsql' && '1' || '0' }}
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php || '8.6' }}
          extensions: pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, redis, curl, mbstring, intl, sodium, zip, fileinfo, apcu, shmop, sysvsem${{ (inputs.scenario == 'cache-memcached' || startsWith(inputs.scenario, 'ecosystem-cache-memcached-') || inputs.scenario == 'ecosystem-cache-atomic-memcached' || inputs.scenario == 'ecosystem-cache-bulk-memcached' || inputs.scenario == 'ecosystem-cache-tags-memcached' || inputs.scenario == 'ecosystem-cache-remember-memcached' || inputs.scenario == 'ecosystem-cache-lock-ownership-memcached' || inputs.scenario == 'ecosystem-cache-stampede-memcached' || inputs.scenario == 'ecosystem-cache-metrics-memcached' || inputs.scenario == 'ecosystem-foundation-risk-qualification-memcached' || inputs.scenario == 'ecosystem-foundation-webhook-replay-memcached' || inputs.scenario == 'ecosystem-foundation-webhook-rotation-memcached' || inputs.scenario == 'ecosystem-foundation-risk-corruption-memcached' || inputs.scenario == 'ecosystem-foundation-risk-outage-memcached' || inputs.scenario == 'ecosystem-di-cache-parity-memcached' || inputs.scenario == 'ecosystem-di-cache-process-memcached' || inputs.scenario == 'ecosystem-response-cache-freshness-memcached' || inputs.scenario == 'ecosystem-response-cache-bypass-memcached' || inputs.scenario == 'ecosystem-foundation-risk-isolation-memcached' || inputs.scenario == 'ecosystem-foundation-risk-concurrent-memcached' || inputs.scenario == 'ecosystem-cache-ttl-forms-memcached' || inputs.scenario == 'ecosystem-cache-mixed-atomic-memcached' || inputs.scenario == 'ecosystem-cache-payload-policy-memcached') && ', memcached' || '' }}${{ inputs.backend == 'mssql' && ', pdo_sqlsrv' || '' }}${{ inputs.host == 'swoole' && ', swoole' || '' }}${{ inputs.host == 'openswoole' && ', openswoole' || '' }}${{ startsWith(inputs.scenario, 'ecosystem-ftp') && ', ftp' || '' }}${{ (inputs.scenario == 'ecosystem-scylla' || startsWith(inputs.scenario, 'ecosystem-cache-scylla-')) && ', cassandra' || '' }}${{ (inputs.scenario == 'ecosystem-wire-http3' || inputs.scenario == 'ecosystem-wire-http3-flow' || inputs.scenario == 'ecosystem-wire-http3-admission' || inputs.scenario == 'ecosystem-wire-outbound-h3') && ', quic' || '' }}${{ inputs.scenario == 'ecosystem-compression-codings' && ', brotli, zstd' || '' }}
          tools: composer:v2
          ini-values: apc.enable_cli=1
          coverage: none
      - name: Provision Microsoft ODBC driver for SQL Server
        if: inputs.backend == 'mssql'
        shell: bash
        run: |
          set -euo pipefail
          if ! odbcinst -q -d -n 'ODBC Driver 18 for SQL Server' >/dev/null 2>&1; then
            . /etc/os-release
            test "$ID" = ubuntu
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb" -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
          odbcinst -q -d -n 'ODBC Driver 18 for SQL Server'
      - name: Install MongoDB extension for the optional driver
        if: inputs.scenario == 'ecosystem-mongodb' || startsWith(inputs.scenario, 'ecosystem-cache-mongodb-') || startsWith(inputs.scenario, 'ecosystem-gridfs')
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, curl, mbstring, intl, sodium, zip, fileinfo
          tools: composer:v2
          coverage: none
      - name: Set up isolated runner paths
        shell: bash
        run: |
          printf 'PROJECT=%s/production-app\nEVIDENCE=%s/workload-evidence\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install real published production application
        shell: bash
        run: |
          set -euo pipefail
          unset COMPOSER_NO_DEV
          mkdir -p "$EVIDENCE"
          composer create-project --no-dev --prefer-dist --no-interaction --no-progress infocyph/infbyte "$PROJECT" '^4.0'
          cd "$PROJECT"
          for feature in data.database data.filesystem security.crypto security.validation security.mfa security.passkey execution.messaging execution.communication; do
            php infbyte module:install "$feature" --json=1 > "$EVIDENCE/install-$feature.json"
            php -r '$r=json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR); if (($r["status"]??null)!=="complete") exit(1);' "$EVIDENCE/install-$feature.json"
            php infbyte module:enable "$feature" --json=1
          done
          test ! -d vendor/infocyph/phpforge
          test ! -e vendor/bin/pest
          mkdir -p lab
          cp "$GITHUB_WORKSPACE"/qa/workloads/*.php lab/
          php -r '
            $path="composer.json";
            $config=json_decode(file_get_contents($path),true,flags:JSON_THROW_ON_ERROR);
            $config["autoload"]["psr-4"]["Experiment\\"]="lab/";
            $config["autoload"]["files"][]="lab/helpers.php";
            file_put_contents($path,json_encode($config,JSON_THROW_ON_ERROR|JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES).PHP_EOL);
          '
          composer dump-autoload --no-dev --optimize --no-interaction
          composer check-platform-reqs --no-dev
          composer show --format=json > "$EVIDENCE/packages.json"
          php -v > "$EVIDENCE/php.txt"
          php -m > "$EVIDENCE/extensions.txt"
          php --ini=diff > "$EVIDENCE/ini.txt"
          lscpu > "$EVIDENCE/cpu.txt"
          free -m > "$EVIDENCE/memory.txt"
          for source in "$GITHUB_WORKSPACE"/qa/workloads/*.php; do php -l "$source"; done
      - name: Provision PHP-FPM and Nginx for the FPM workload
        if: inputs.host == 'fpm'
        run: |
          docker build -t infbyte-lab-fpm - < qa/workloads/Fpm.Dockerfile
          docker run --rm infbyte-lab-fpm php -v
          docker run --rm infbyte-lab-fpm php -m
          docker pull nginx:alpine
      - name: Provision the actual RoadRunner binary and host client
        if: inputs.host == 'roadrunner'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          composer require 'roadrunner/http:^4.0' --no-interaction --prefer-dist --no-progress --with-all-dependencies
          composer check-platform-reqs --no-dev
          composer show --format=json > "$EVIDENCE/packages.json"
          docker pull ghcr.io/roadrunner-server/roadrunner:3.0.1
          container="$(docker create ghcr.io/roadrunner-server/roadrunner:3.0.1)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/rr" "$RUNNER_TEMP/lab-rr"
          chmod +x "$RUNNER_TEMP/lab-rr"
          "$RUNNER_TEMP/lab-rr" --version | tee "$EVIDENCE/roadrunner-version.txt"
      - name: Provision actual FrankenPHP worker runtime
        if: inputs.host == 'frankenphp'
        shell: bash
        run: |
          docker build -t infbyte-lab-frankenphp - < qa/workloads/Frankenphp.Dockerfile
          docker run --rm --entrypoint php infbyte-lab-frankenphp -v
          docker run --rm --entrypoint php infbyte-lab-frankenphp -m
      - name: Execute independent concurrent business workers and reconcile state
        if: inputs.scenario != 'http' && inputs.scenario != 'operations' && inputs.scenario != 'browser' && inputs.scenario != 'transfer' && inputs.scenario != 'transfer-cleanup' && inputs.scenario != 'oauth-http' && !startsWith(inputs.scenario, 'db-') && !startsWith(inputs.scenario, 'ecosystem-')
        shell: bash
        run: bash qa/workloads/stress.sh
      - name: Exercise independent core and ecosystem capabilities
        if: startsWith(inputs.scenario, 'ecosystem-')
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
          REDIS_SERVICE: ${{ job.services.redis.id }}
          MAIL_SERVICE: ${{ job.services.mailpit.id }}
        shell: bash
        run: bash qa/workloads/ecosystem.sh
      - name: Exercise DBLayer database mechanics independently
        if: startsWith(inputs.scenario, 'db-')
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
          MSSQL_SERVICE: ${{ job.services.mssql.id }}
          MYSQL_SERVICE: ${{ job.services.mysql.id }}
          MARIADB_SERVICE: ${{ job.services.mariadb.id }}
        shell: bash
        run: bash qa/workloads/database.sh
      - name: Exercise compiled production HTTP application and host replacement
        if: inputs.scenario == 'http' || inputs.scenario == 'browser' || inputs.scenario == 'transfer' || inputs.scenario == 'transfer-cleanup' || inputs.scenario == 'oauth-http'
        shell: bash
        run: bash qa/workloads/http.sh
      - name: Exercise distributed scheduling, state restore, release rollback and backend failure
        if: inputs.scenario == 'operations'
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
          REDIS_SERVICE: ${{ job.services.redis.id }}
        shell: bash
        run: bash qa/workloads/operations.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workload-${{ inputs.scenario }}-${{ inputs.backend }}-${{ inputs.host || 'worker' }}-${{ inputs.matcher || 'fused' }}
          path: ${{ runner.temp }}/workload-evidence/
          if-no-files-found: error
          retention-days: 30
