name: Published PHPProbe engineering acceptance
on:
  push:
    branches: [main]
    paths: ['qa/workloads/phpprobe.sh', '.github/workflows/phpprobe-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    strategy:
      fail-fast: false
      matrix:
        mode: [syntax-graph, reference, duplicates, comments, config-check, changed-only, graph-api, reference-scope, duplicate-cache, comment-options, syntax-options, config-precedence, config-schema-init, check-gate-artifacts, comment-custom, comment-suppression, graph-root-boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          tools: composer:v2
          coverage: none
      - run: bash qa/workloads/phpprobe.sh
        env:
          PROBE_MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpprobe-evidence-${{ matrix.mode }}
          path: ${{ runner.temp }}/probe-evidence/
