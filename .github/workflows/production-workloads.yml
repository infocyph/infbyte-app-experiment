name: Production workload laboratory
on:
  push:
    branches: [main]
    paths: ['qa/**', '.github/workflows/production-workloads.yml', '.github/workflows/production-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
