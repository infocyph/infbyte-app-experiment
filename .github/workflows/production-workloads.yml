name: Production workload laboratory
on:
  push:
    branches: [main]
    paths: ['qa/**', '.github/workflows/production-workloads.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workload:
    name: "${{ matrix.scenario }} / ${{ matrix.backend }} / ${{ matrix.host || 'worker' }} / ${{ matrix.matcher || 'default' }} / PHP ${{ matrix.php || '8.6' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: browser, backend: pgsql, host: roadrunner, matcher: fused}
          - {scenario: browser, backend: pgsql, host: roadrunner, matcher: sharded}
          - {scenario: browser, backend: pgsql, host: frankenphp, matcher: fused}
          - {scenario: browser, backend: pgsql, host: frankenphp, matcher: sharded}
          - {scenario: ecosystem-scylla, backend: pgsql, php: '8.4'}
          - {scenario: ecosystem-redis-failover, backend: pgsql}
          - {scenario: ecosystem-storage-local-modes, backend: pgsql}
          - {scenario: ecosystem-ftp, backend: pgsql}
          - {scenario: ecosystem-webdav, backend: pgsql}
          - {scenario: ecosystem-gridfs, backend: pgsql, php: '8.4'}
          - {scenario: ecosystem-sftp2, backend: pgsql}
          - {scenario: ecosystem-async-s3, backend: pgsql}
          - {scenario: ecosystem-azure, backend: pgsql}
          - {scenario: ecosystem-gcs, backend: pgsql}
          - {scenario: db-proxy-session, backend: pgsql}
          - {scenario: db-proxy-transaction, backend: pgsql}
          - {scenario: ecosystem-wire-tcp, backend: pgsql}
          - {scenario: ecosystem-wire-unix, backend: pgsql}
          - {scenario: ecosystem-wire-udp, backend: pgsql}
          - {scenario: ecosystem-wire-websocket, backend: pgsql}
          - {scenario: ecosystem-wire-http2, backend: pgsql}
          - {scenario: ecosystem-invalidation-sql, backend: mysql}
          - {scenario: ecosystem-invalidation-sql, backend: pgsql}
          - {scenario: ecosystem-invalidation-stream, backend: pgsql}
          - {scenario: browser, backend: pgsql, host: swoole, matcher: fused, php: '8.5'}
          - {scenario: browser, backend: pgsql, host: swoole, matcher: sharded, php: '8.5'}
          - {scenario: browser, backend: pgsql, host: openswoole, matcher: fused, php: '8.6'}
          - {scenario: browser, backend: pgsql, host: openswoole, matcher: sharded, php: '8.6'}
          - {scenario: ecosystem-module-0, backend: pgsql}
          - {scenario: ecosystem-module-1, backend: pgsql}
          - {scenario: ecosystem-module-2, backend: pgsql}
          - {scenario: ecosystem-module-3, backend: pgsql}
          - {scenario: ecosystem-module-4, backend: pgsql}
          - {scenario: ecosystem-module-5, backend: pgsql}
          - {scenario: ecosystem-module-6, backend: pgsql}
          - {scenario: ecosystem-module-7, backend: pgsql}
          - {scenario: ecosystem-module-lifecycle, backend: pgsql}
          - {scenario: ecosystem-amqp, backend: pgsql}
          - {scenario: ecosystem-sqs, backend: pgsql}
          - {scenario: ecosystem-imap, backend: pgsql}
          - {scenario: ecosystem-pop3, backend: pgsql}
          - {scenario: ecosystem-jwt-jws, backend: pgsql}
          - {scenario: ecosystem-jwe, backend: pgsql}
          - {scenario: ecosystem-gateway, backend: pgsql}
          - {scenario: ecosystem-response-cache, backend: pgsql}
          - {scenario: ecosystem-throttle, backend: pgsql}
          - {scenario: ecosystem-cookie-protection, backend: pgsql}
          - {scenario: db-binlog-replica, backend: mysql}
          - {scenario: db-binlog-replica, backend: mariadb}
          - {scenario: ecosystem-uid-sequences, backend: pgsql}
          - {scenario: ecosystem-closure, backend: pgsql}
          - {scenario: ecosystem-config-layering, backend: pgsql}
          - {scenario: ecosystem-pki, backend: pgsql}
          - {scenario: ecosystem-crypto-algorithms, backend: pgsql}
          - {scenario: ecosystem-validation-registry, backend: pgsql}
          - {scenario: ecosystem-endurance, backend: mysql, matcher: fused}
          - {scenario: ecosystem-endurance, backend: pgsql, matcher: sharded}
          - {scenario: ecosystem-http-policy, backend: pgsql}
          - {scenario: ecosystem-redis-cluster, backend: pgsql}
          - {scenario: ecosystem-mongodb, backend: pgsql, php: '8.4'}
          - {scenario: ecosystem-s3, backend: pgsql}
          - {scenario: ecosystem-sftp, backend: pgsql}
          - {scenario: ecosystem-connected, backend: mysql, matcher: fused}
          - {scenario: ecosystem-connected, backend: mysql, matcher: sharded}
          - {scenario: ecosystem-connected, backend: pgsql, matcher: fused}
          - {scenario: ecosystem-connected, backend: pgsql, matcher: sharded}
          - {scenario: ecosystem-routing, backend: pgsql, matcher: fused}
          - {scenario: ecosystem-routing, backend: pgsql, matcher: sharded}
          - {scenario: ecosystem-coroutines, backend: pgsql}
          - {scenario: ecosystem-async-files, backend: pgsql}
          - {scenario: ecosystem-pathwise-upload, backend: pgsql}
          - {scenario: ecosystem-pathwise-download, backend: pgsql}
          - {scenario: ecosystem-mail-mime, backend: pgsql}
          - {scenario: ecosystem-omnibus-workflow, backend: pgsql}
          - {scenario: ecosystem-omnibus-workflow, backend: mysql}
          - {scenario: ecosystem-omnibus-redis, backend: pgsql}
          - {scenario: ecosystem-omnibus-redis, backend: mysql}
          - {scenario: ecosystem-cache-tier, backend: pgsql}
          - {scenario: ecosystem-cache-local, backend: pgsql}
          - {scenario: ecosystem-cache-integrity, backend: pgsql}
          - {scenario: ecosystem-cache-race, backend: pgsql}
          - {scenario: ecosystem-otp-race, backend: pgsql}
          - {scenario: ecosystem-otp-recovery, backend: pgsql}
          - {scenario: ecosystem-validation, backend: pgsql}
          - {scenario: ecosystem-crypto-file, backend: pgsql}
          - {scenario: ecosystem-crypto-envelope, backend: pgsql}
          - {scenario: ecosystem-core-lifecycle, backend: pgsql}
          - {scenario: ecosystem-intermix, backend: pgsql}
          - {scenario: ecosystem-array-config, backend: pgsql}
          - {scenario: ecosystem-array-stream, backend: pgsql}
          - {scenario: ecosystem-uid-formats, backend: pgsql}
          - {scenario: db-serialization, backend: pgsql}
          - {scenario: db-lock-modes, backend: mysql}
          - {scenario: db-lock-modes, backend: pgsql}
          - {scenario: db-native-owner, backend: mysql}
          - {scenario: db-native-owner, backend: pgsql}
          - {scenario: db-native-owner, backend: sqlite}
          - {scenario: db-callback-failure, backend: mysql}
          - {scenario: db-callback-failure, backend: pgsql}
          - {scenario: db-callback-failure, backend: sqlite}
          - {scenario: db-driver, backend: mysql}
          - {scenario: db-driver, backend: pgsql}
          - {scenario: db-driver, backend: sqlite}
          - {scenario: db-driver, backend: mariadb}
          - {scenario: db-driver, backend: mssql, php: '8.4'}
          - {scenario: db-relations, backend: mysql}
          - {scenario: db-relations, backend: pgsql}
          - {scenario: db-relations, backend: sqlite}
          - {scenario: db-lock-wait, backend: mysql}
          - {scenario: db-lock-wait, backend: pgsql}
          - {scenario: db-pool-lifecycle, backend: mysql}
          - {scenario: db-pool-lifecycle, backend: pgsql}
          - {scenario: db-budgets, backend: mysql}
          - {scenario: db-budgets, backend: pgsql}
          - {scenario: db-isolation, backend: mysql}
          - {scenario: db-isolation, backend: pgsql}
          - {scenario: db-wal, backend: sqlite}
          - {scenario: db-replica-fault, backend: pgsql}
          - {scenario: db-schema, backend: mysql}
          - {scenario: db-schema, backend: pgsql}
          - {scenario: db-schema, backend: sqlite}
          - {scenario: db-query, backend: mysql}
          - {scenario: db-query, backend: pgsql}
          - {scenario: db-query, backend: sqlite}
          - {scenario: db-repository, backend: mysql}
          - {scenario: db-repository, backend: pgsql}
          - {scenario: db-repository, backend: sqlite}
          - {scenario: db-query-cache, backend: mysql}
          - {scenario: db-query-cache, backend: pgsql}
          - {scenario: db-query-cache, backend: sqlite}
          - {scenario: db-stream, backend: mysql}
          - {scenario: db-stream, backend: pgsql}
          - {scenario: db-stream, backend: sqlite}
          - {scenario: db-security, backend: mysql}
          - {scenario: db-security, backend: pgsql}
          - {scenario: db-security, backend: sqlite}
          - {scenario: db-transactions, backend: mysql}
          - {scenario: db-transactions, backend: pgsql}
          - {scenario: db-locking, backend: mysql}
          - {scenario: db-locking, backend: pgsql}
          - {scenario: db-pool, backend: mysql}
          - {scenario: db-pool, backend: pgsql}
          - {scenario: db-replicas, backend: pgsql}
          - {scenario: cache-file, backend: pgsql}
          - {scenario: cache-phpfiles, backend: pgsql}
          - {scenario: cache-sqlite, backend: pgsql}
          - {scenario: cache-mysql, backend: mysql}
          - {scenario: cache-pgsql, backend: pgsql}
          - {scenario: cache-valkey, backend: pgsql}
          - {scenario: cache-memcached, backend: pgsql}
          - {scenario: refresh, backend: mysql}
          - {scenario: refresh, backend: pgsql}
          - {scenario: oidc, backend: mysql}
          - {scenario: oidc, backend: pgsql}
          - {scenario: dpop, backend: mysql}
          - {scenario: dpop, backend: pgsql}
          - {scenario: pat, backend: mysql}
          - {scenario: pat, backend: pgsql}
          - {scenario: risk, backend: mysql}
          - {scenario: risk, backend: pgsql}
          - {scenario: browser, backend: pgsql, host: native, matcher: fused}
          - {scenario: browser, backend: pgsql, host: native, matcher: sharded}
          - {scenario: browser, backend: pgsql, host: fpm, php: '8.4', matcher: fused}
          - {scenario: browser, backend: pgsql, host: fpm, php: '8.4', matcher: sharded}
          - {scenario: import, backend: mysql}
          - {scenario: import, backend: pgsql}
          - {scenario: native-otp, backend: pgsql}
          - {scenario: orders, backend: pgsql}
          - {scenario: orders, backend: mysql}
          - {scenario: accounts, backend: pgsql}
          - {scenario: accounts, backend: mysql}
          - {scenario: mail, backend: pgsql}
          - {scenario: authorization, backend: pgsql}
          - {scenario: authorization, backend: mysql}
          - {scenario: security, backend: pgsql}
          - {scenario: security, backend: mysql}
          - {scenario: queue, backend: pgsql}
          - {scenario: queue, backend: mysql}
          - {scenario: passkey, backend: pgsql}
          - {scenario: passkey, backend: mysql}
          - {scenario: http, backend: pgsql, host: native, matcher: fused}
          - {scenario: http, backend: pgsql, host: native, matcher: sharded}
          - {scenario: http, backend: mysql, host: native, matcher: fused}
          - {scenario: http, backend: mysql, host: native, matcher: sharded}
          - {scenario: http, backend: pgsql, host: fpm, php: '8.4', matcher: fused}
          - {scenario: http, backend: pgsql, host: fpm, php: '8.4', matcher: sharded}
          - {scenario: protocols, backend: pgsql}
          - {scenario: operations, backend: pgsql}
          - {scenario: storage, backend: pgsql}
          - {scenario: oauth, backend: mysql}
          - {scenario: oauth, backend: pgsql}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: experiment
          POSTGRES_USER: experiment
          POSTGRES_PASSWORD: experiment
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U experiment -d experiment" --health-interval 5s --health-timeout 5s --health-retries 15
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: experiment
          MYSQL_USER: experiment
          MYSQL_PASSWORD: experiment
          MYSQL_ROOT_PASSWORD: experiment-root
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h localhost --silent" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: ${{ matrix.backend == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_DATABASE: experiment
          MARIADB_USER: experiment
          MARIADB_PASSWORD: experiment
          MARIADB_ROOT_PASSWORD: experiment-root
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: ${{ matrix.backend == 'mssql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Experiment-Only-42!'
        ports: ['1433:1433']
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
      valkey:
        image: ${{ matrix.scenario == 'cache-valkey' && 'valkey/valkey:8' || '' }}
        ports: ['6380:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
      memcached:
        image: ${{ matrix.scenario == 'cache-memcached' && 'memcached:1.6' || '' }}
        ports: ['11211:11211']
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      SCENARIO: ${{ matrix.scenario }}
      HOST_MODE: ${{ matrix.host || 'worker' }}
      LAB_MATCHER: ${{ matrix.matcher || 'fused' }}
      DB_BACKEND: ${{ matrix.backend }}
      PHP_SERIES: ${{ matrix.php || '8.6' }}
      SOAK: ${{ matrix.scenario == 'http' && matrix.host == 'native' && matrix.backend == 'pgsql' && '1' || '0' }}
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php || '8.6' }}
          extensions: pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, curl, mbstring, intl, sodium, zip, fileinfo, apcu, shmop, sysvsem${{ matrix.scenario == 'cache-memcached' && ', memcached' || '' }}${{ matrix.backend == 'mssql' && ', pdo_sqlsrv' || '' }}${{ matrix.host == 'swoole' && ', swoole' || '' }}${{ matrix.host == 'openswoole' && ', openswoole' || '' }}${{ matrix.scenario == 'ecosystem-ftp' && ', ftp' || '' }}${{ matrix.scenario == 'ecosystem-scylla' && ', cassandra' || '' }}
          tools: composer:v2
          ini-values: apc.enable_cli=1
          coverage: none
      - name: Provision Microsoft ODBC driver for SQL Server
        if: matrix.backend == 'mssql'
        shell: bash
        run: |
          set -euo pipefail
          if ! odbcinst -q -d -n 'ODBC Driver 18 for SQL Server' >/dev/null 2>&1; then
            . /etc/os-release
            test "$ID" = ubuntu
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb" -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
          odbcinst -q -d -n 'ODBC Driver 18 for SQL Server'
      - name: Install MongoDB extension for the optional driver
        if: matrix.scenario == 'ecosystem-mongodb' || matrix.scenario == 'ecosystem-gridfs'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, curl, mbstring, intl, sodium, zip, fileinfo
          tools: composer:v2
          coverage: none
      - name: Set up isolated runner paths
        shell: bash
        run: |
          printf 'PROJECT=%s/production-app\nEVIDENCE=%s/workload-evidence\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install real published production application
        shell: bash
        run: |
          set -euo pipefail
          unset COMPOSER_NO_DEV
          mkdir -p "$EVIDENCE"
          composer create-project --no-dev --prefer-dist --no-interaction --no-progress infocyph/infbyte "$PROJECT" '^4.0'
          cd "$PROJECT"
          for feature in data.database data.filesystem security.crypto security.validation security.mfa security.passkey execution.messaging execution.communication; do
            php infbyte module:install "$feature" --json=1 > "$EVIDENCE/install-$feature.json"
            php -r '$r=json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR); if (($r["status"]??null)!=="complete") exit(1);' "$EVIDENCE/install-$feature.json"
            php infbyte module:enable "$feature" --json=1
          done
          test ! -d vendor/infocyph/phpforge
          test ! -e vendor/bin/pest
          mkdir -p lab
          cp "$GITHUB_WORKSPACE"/qa/workloads/*.php lab/
          php -r '
            $path="composer.json";
            $config=json_decode(file_get_contents($path),true,flags:JSON_THROW_ON_ERROR);
            $config["autoload"]["psr-4"]["Experiment\\"]="lab/";
            $config["autoload"]["files"][]="lab/helpers.php";
            file_put_contents($path,json_encode($config,JSON_THROW_ON_ERROR|JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES).PHP_EOL);
          '
          composer dump-autoload --no-dev --optimize --no-interaction
          composer check-platform-reqs --no-dev
          composer show --format=json > "$EVIDENCE/packages.json"
          php -v > "$EVIDENCE/php.txt"
          php -m > "$EVIDENCE/extensions.txt"
          php --ini=diff > "$EVIDENCE/ini.txt"
          lscpu > "$EVIDENCE/cpu.txt"
          free -m > "$EVIDENCE/memory.txt"
          for source in "$GITHUB_WORKSPACE"/qa/workloads/*.php; do php -l "$source"; done
      - name: Provision PHP-FPM and Nginx for the FPM workload
        if: matrix.host == 'fpm'
        run: |
          docker build -t infbyte-lab-fpm - < qa/workloads/Fpm.Dockerfile
          docker run --rm infbyte-lab-fpm php -v
          docker run --rm infbyte-lab-fpm php -m
          docker pull nginx:alpine
      - name: Provision the actual RoadRunner binary and host client
        if: matrix.host == 'roadrunner'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          composer require 'roadrunner/http:^4.0' --no-interaction --prefer-dist --no-progress --with-all-dependencies
          composer check-platform-reqs --no-dev
          composer show --format=json > "$EVIDENCE/packages.json"
          docker pull ghcr.io/roadrunner-server/roadrunner:3.0.1
          container="$(docker create ghcr.io/roadrunner-server/roadrunner:3.0.1)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/rr" "$RUNNER_TEMP/lab-rr"
          chmod +x "$RUNNER_TEMP/lab-rr"
          "$RUNNER_TEMP/lab-rr" --version | tee "$EVIDENCE/roadrunner-version.txt"
      - name: Provision actual FrankenPHP worker runtime
        if: matrix.host == 'frankenphp'
        shell: bash
        run: |
          docker build -t infbyte-lab-frankenphp - < qa/workloads/Frankenphp.Dockerfile
          docker run --rm --entrypoint php infbyte-lab-frankenphp -v
          docker run --rm --entrypoint php infbyte-lab-frankenphp -m
      - name: Execute independent concurrent business workers and reconcile state
        if: matrix.scenario != 'http' && matrix.scenario != 'operations' && matrix.scenario != 'browser' && !startsWith(matrix.scenario, 'db-') && !startsWith(matrix.scenario, 'ecosystem-')
        shell: bash
        run: bash qa/workloads/stress.sh
      - name: Exercise independent core and ecosystem capabilities
        if: startsWith(matrix.scenario, 'ecosystem-')
        shell: bash
        run: bash qa/workloads/ecosystem.sh
      - name: Exercise DBLayer database mechanics independently
        if: startsWith(matrix.scenario, 'db-')
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
        shell: bash
        run: bash qa/workloads/database.sh
      - name: Exercise compiled production HTTP application and host replacement
        if: matrix.scenario == 'http' || matrix.scenario == 'browser'
        shell: bash
        run: bash qa/workloads/http.sh
      - name: Exercise distributed scheduling, state restore, release rollback and backend failure
        if: matrix.scenario == 'operations'
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
          REDIS_SERVICE: ${{ job.services.redis.id }}
        shell: bash
        run: bash qa/workloads/operations.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workload-${{ matrix.scenario }}-${{ matrix.backend }}-${{ matrix.host || 'worker' }}-${{ matrix.matcher || 'default' }}
          path: ${{ runner.temp }}/workload-evidence/
          if-no-files-found: error
          retention-days: 30

  grpc:
    name: Native gRPC / PHP 8.6 / ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [unary, streaming-tls]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          extensions: none, grpc, curl, mbstring, intl, sodium, pdo, pdo_sqlite, dom, simplexml, xml, xmlreader, xmlwriter, tokenizer, ctype, fileinfo, iconv, phar, openssl, session, sockets, pcntl, posix, zip
          tools: composer:v2
          coverage: none
      - name: Isolate native extension configuration
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/grpc-ini.XXXXXXXX")"
          mkdir "$root/scan"
          module_dir="$(php -r 'echo ini_get("extension_dir");')"
          printf 'extension_dir="%s"\ndate.timezone=UTC\nmemory_limit=512M\nopcache.enable=0\nopcache.enable_cli=0\nopcache.jit_buffer_size=0\n' "$module_dir" > "$root/php.ini"
          for extension in libxml ctype fileinfo iconv openssl phar tokenizer pdo pdo_sqlite dom simplexml xml xmlreader xmlwriter curl mbstring intl sodium session sockets pcntl posix zip grpc; do
            if php -n -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' -- "$extension"; then continue; fi
            test -f "$module_dir/$extension.so"
            printf 'extension=%s.so\n' "$extension" >> "$root/php.ini"
          done
          printf 'PHPRC=%s\nPHP_INI_SCAN_DIR=%s\nPROJECT=%s/grpc-app\nEVIDENCE=%s/grpc-evidence\n' "$root/php.ini" "$root/scan" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install published communication feature
        shell: bash
        run: |
          set -euo pipefail
          unset COMPOSER_NO_DEV
          mkdir -p "$EVIDENCE"
          php --ri grpc
          composer create-project --no-dev --prefer-dist --no-interaction --no-progress infocyph/infbyte "$PROJECT" '^4.0'
          cd "$PROJECT"
          php infbyte module:install execution.communication
          php infbyte module:enable execution.communication
          test ! -d vendor/infocyph/phpforge
          composer check-platform-reqs --no-dev
          composer show --format=json > "$EVIDENCE/packages.json"
          php --ini > "$EVIDENCE/ini.txt"
      - name: Concurrent real unary calls and error status
        if: matrix.mode == 'unary'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/grpc-peer-venv"
          python="$RUNNER_TEMP/grpc-peer-venv/bin/python"
          "$python" -m pip install 'grpcio>=1.76,<2'
          "$python" qa/workloads/grpc-peer.py "$RUNNER_TEMP/grpc-ready.json" > "$EVIDENCE/peer.log" 2>&1 &
          peer=$!
          trap 'kill "$peer" 2>/dev/null || :; wait "$peer" 2>/dev/null || :' EXIT
          for attempt in $(seq 1 100); do
            if [[ -f "$RUNNER_TEMP/grpc-ready.json" ]]; then break; fi
            kill -0 "$peer"
            sleep 0.1
          done
          export GRPC_TEST_PORT="$(php -r 'echo json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR)["port"];' "$RUNNER_TEMP/grpc-ready.json")"
          for concurrency in 1 4 8; do
            start="$(php -r 'echo intdiv(hrtime(true), 1000000);')"
            pids=()
            for worker in $(seq 1 "$concurrency"); do
              php qa/workloads/grpc-client.php "$concurrency-$worker" 100 > "$EVIDENCE/results-$concurrency-$worker.jsonl" 2> "$EVIDENCE/errors-$concurrency-$worker.log" &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do if ! wait "$pid"; then failed=1; fi; done
            if (( failed )); then cat "$EVIDENCE"/errors-"$concurrency"-*.log >&2; exit 1; fi
            php qa/workloads/report.php "$((concurrency * 100))" "$(( $(php -r 'echo intdiv(hrtime(true), 1000000);') - start ))" "$concurrency" "$EVIDENCE"/results-"$concurrency"-*.jsonl | tee "$EVIDENCE/summary-$concurrency.json"
          done
      - name: Real native streaming, TLS, deadline and cancellation
        if: matrix.mode == 'streaming-tls'
        shell: bash
        run: bash qa/workloads/grpc-stream.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-grpc-evidence-${{ matrix.mode }}
          path: ${{ runner.temp }}/grpc-evidence/
          if-no-files-found: error
