name: Production workload laboratory
on:
  workflow_dispatch:
    inputs:
      group:
        description: Full matrix or one workload group
        type: choice
        required: true
        default: all
        options: [all, database, database-expansion, ecosystem, ecosystem-extra, ecosystem-residual, ecosystem-expansion, ecosystem-closure, ecosystem-final, ecosystem-specialist, application, grpc]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.group != 'all' && format('-{0}', inputs.group) || '' }}
  cancel-in-progress: true
