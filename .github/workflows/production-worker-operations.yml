name: Production worker - operations
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Exact scenario name from the frozen workload matrix
        required: true
        type: string
      backend:
        description: Database backend
        required: true
        type: choice
        default: pgsql
        options: [pgsql, mysql, mariadb, sqlite, mssql]
      host:
        description: Runtime (match the matrix entry)
        required: true
        type: choice
        default: worker
        options: [worker, native, fpm, roadrunner, frankenphp, swoole, openswoole]
      matcher:
        description: Route matcher
        required: true
        type: choice
        default: fused
        options: [fused, sharded]
  workflow_call:
    inputs:
      scenario:
        required: true
        type: string
      backend:
        required: true
        type: string
      host:
        type: string
        default: worker
      matcher:
        type: string
        default: fused
permissions:
  contents: read
jobs:
  execute:
    name: Execute workload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: production-worker-operations-${{ github.ref }}-${{ inputs.scenario }}-${{ inputs.backend }}-${{ inputs.host || 'worker' }}-${{ inputs.matcher || 'fused' }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: experiment
          POSTGRES_USER: experiment
          POSTGRES_PASSWORD: experiment
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U experiment -d experiment" --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      SCENARIO: ${{ inputs.scenario }}
      HOST_MODE: ${{ inputs.host || 'worker' }}
      LAB_MATCHER: ${{ inputs.matcher || 'fused' }}
      DB_BACKEND: ${{ inputs.backend }}
      PHP_SERIES: '8.5'
      SOAK: ${{ inputs.scenario == 'http' && inputs.host == 'native' && inputs.backend == 'pgsql' && '1' || '0' }}
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-production-workload
        with:
          worker_type: operations
          scenario: ${{ inputs.scenario }}
          backend: ${{ inputs.backend }}
          host: ${{ inputs.host || 'worker' }}
          extensions: pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, redis, curl, mbstring, intl, sodium, zip, fileinfo, apcu, shmop, sysvsem
      - name: Exercise distributed scheduling, state restore, release rollback and backend failure
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
          REDIS_SERVICE: ${{ job.services.redis.id }}
        shell: bash
        run: bash qa/workloads/operations.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workload-${{ inputs.scenario }}-${{ inputs.backend }}-${{ inputs.host || 'worker' }}-${{ inputs.matcher || 'fused' }}
          path: ${{ runner.temp }}/workload-evidence/
          if-no-files-found: error
          retention-days: 30
